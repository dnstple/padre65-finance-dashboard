<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padre65 Stock Planner</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0f1216; --surface: #171b21; --surface-2: #1e232b; --border: #2a313b; --border-strong: #3a434f;
  --text: #e6e8eb; --text-2: #b4bac3; --muted: #8a919c; --accent: #3987e5;
  --pop: #3987e5; --all: #199e70; --cost: #d95926; --exp: #c98500; --grid: rgba(255,255,255,.07);
  --good: #0ca30c; --bad: #e66767;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f6f4; --surface: #ffffff; --surface-2: #f3f3f1; --border: #e2e1dd; --border-strong: #cfcdc7;
  --text: #0b0b0b; --text-2: #3d3c39; --muted: #6b6a66; --accent: #2a78d6;
  --pop: #2a78d6; --all: #1baf7a; --cost: #eb6834; --exp: #a86f00; --grid: rgba(0,0,0,.07);
  --good: #0a8a0a; --bad: #d03b3b;
}
* { box-sizing: border-box; }
body { margin: 0; background: transparent; color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 60px; }
header { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
button { background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong); border-radius: 8px; padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
button.chip { border-radius: 999px; padding: 3px 10px; font-size: 12px; }
input { background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: 6px; padding: 5px 6px; font: inherit; font-size: 14px; width: 74px; text-align: right; }
input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input.changed { border-color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 25px; font-weight: 650; margin-top: 2px; }
.kpi .d { font-size: 12px; color: var(--text-2); }
.kpi .v2 { font-size: 17px; font-weight: 600; margin: 1px 0 3px; }
.kpi .up { color: var(--good); } .kpi .down { color: var(--bad); }
.kpi .bar { height: 4px; border-radius: 2px; margin-bottom: 8px; }
.settings { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
.settings label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.product { display: block; }
.tablewrap { container-type: inline-size; }
/* chart and notes side by side under the table; they stack when there isn't room for both */
.lower { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 22px; margin-top: 16px; align-items: start; }
.lower .log { margin-top: 0; border-top: 0; padding-top: 0; }
/* when the table itself is too narrow, each colour becomes a labelled card (no sideways scrolling) */
@container (max-width: 820px) {
  .ptable thead { display: none; }
  .ptable tr { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .ptable td { border: 0; padding: 0; text-align: left; white-space: normal; }
  .ptable td[data-label]::before { content: attr(data-label); display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .ptable td.colour { grid-column: 1 / -1; }
  .ptable tr.tot td:not([data-label]) { display: none; }
  .ptable tr.tot td.l { display: block; grid-column: 1 / -1; }
}
.log { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
.log h3 { font-size: 14px; margin: 0; }
.logadd { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; }
.logbox { width: 100%; min-height: 46px; background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: 8px; padding: 7px 9px; font: inherit; font-size: 13.5px; resize: vertical; line-height: 1.45; }
.logentry { background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 12px; margin-top: 8px; }
.logmeta { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 12px; color: var(--muted); }
.logmeta .acts { display: flex; gap: 12px; }
.logtext { white-space: pre-wrap; margin-top: 4px; font-size: 13.5px; line-height: 1.5; color: var(--text); overflow-wrap: anywhere; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-size: 12px; cursor: pointer; }
.linkbtn:hover { text-decoration: underline; }
.linkbtn.del { color: var(--bad); }
.phead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; margin-bottom: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 5px 4px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 11.5px; white-space: nowrap; vertical-align: bottom; }
td.l.colour { white-space: normal; max-width: 150px; }
.cell { display: flex; align-items: center; gap: 8px; }
.thumb { width: 42px; height: 42px; object-fit: cover; border-radius: 6px; background: #fff; flex: none; border: 1px solid var(--border); }
th.l, td.l { text-align: left; }
tr.sel td { background: var(--surface-2); }
tr.tot td { font-weight: 700; border-bottom: 0; }
td.colour { cursor: pointer; }
.stepper { display: inline-flex; align-items: center; gap: 2px; }
.stepper button { padding: 2px 8px; border-radius: 6px; }
.stepper input { width: 44px; }
.stepper button { padding: 2px 6px; }
.hint { font-size: 11px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-2); margin: 6px 0; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 5px; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--exp) 0 4px, transparent 4px 7px); }
svg text { fill: var(--text-2); font-size: 11px; }
svg .gridline { stroke: var(--grid); }
svg .axis { stroke: var(--border-strong); }
#tip { position: fixed; pointer-events: none; background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45; max-width: 360px; display: none; z-index: 9; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.qm { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; margin-left: 5px; border-radius: 50%; border: 1px solid var(--muted); color: var(--muted); font-size: 10px; font-weight: 700; cursor: help; vertical-align: 1px; }
.qm:hover { border-color: var(--accent); color: var(--accent); }
.note { font-size: 12px; color: var(--muted); }
.warn { font-size: 12px; color: var(--exp); }
.notebtn { white-space: nowrap; background: none; border: 0; padding: 0; color: var(--accent); font-size: 11.5px; cursor: pointer; text-align: left; }
.notebtn:hover { text-decoration: underline; }
.notetext { font-size: 12px; color: var(--text-2); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
tr.hasnote td { border-bottom: 0; }
tr.noterow td { padding: 0 6px 7px 56px; max-width: 0; text-align: left; }
.notetext:hover { color: var(--text); }
tr.noteedit td { background: var(--surface-2); white-space: normal; }
tr.noteedit textarea { width: 100%; min-height: 70px; background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 13px; resize: vertical; }
.toggle { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
.toggle button { border: 0; border-radius: 0; padding: 4px 10px; font-size: 12px; }
.sizebtn { margin-top: 4px; padding: 1px 8px; font-size: 11.5px; border-radius: 6px; }
.sizebtn.on { border-color: var(--pop); color: var(--pop); }
.ptable tr.sizerow td { padding: 0 0 14px; text-align: left; white-space: normal; }
.sizepanel { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 14px 22px; }
.sizepanel .ctl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; grid-column: 1 / -1; }
.sizepanel .ctl label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 3px; }
.sizepanel select { max-width: 280px; }
.sizepanel { border-color: var(--pop); background: color-mix(in srgb, var(--pop) 4%, transparent); }
.sizehead { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.sizehead h3 { margin: 0; font-size: 14px; }
.sizehead .acts { display: flex; gap: 8px; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: 1px; }
.badge.mine { background: var(--exp); color: #111; }
.badge.auto { border: 1px solid var(--border-strong); color: var(--muted); }
.sizetable { width: 100%; border-collapse: collapse; }
.sizetable th, .sizetable td { text-align: center; padding: 6px 4px; vertical-align: middle; white-space: nowrap; }
.sizetable th.l, .sizetable td.l { text-align: left; white-space: normal; min-width: 130px; }
.sizetable input { width: 48px; padding: 4px 2px; text-align: center; border-style: dashed; color: var(--muted); }
.sizetable input.mine { border: 2px solid var(--exp); background: color-mix(in srgb, var(--exp) 18%, transparent); color: var(--text); font-weight: 700; }
.sizetable td.tot { font-weight: 700; }
.sizebtn.mine { border-color: var(--exp); color: var(--exp); }
.sizelog { grid-column: 1 / -1; border-top: 1px solid var(--border); padding-top: 10px; }
@container (max-width: 820px) {
  .ptable tr.sizerow { display: block; padding: 0 0 12px; }
  .ptable .sizetable thead { display: table-header-group; }
  .ptable .sizetable tr { display: table-row; padding: 0; border: 0; }
  .ptable .sizetable td, .ptable .sizetable th { display: table-cell; text-align: center; padding: 6px 3px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .ptable .sizetable td.l { text-align: left; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Padre65 · Winter 2027 stock planner</h1>
      <div class="sub" id="coverage"></div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span class="sub" id="saved"></span>
      <button id="save" title="Download a backup of the plan as a file">Download backup</button>
      <button id="load" title="Replace the shared plan with one from a file: a backup, or a planner file / shareable copy from your computer">Load from file</button>
      <input type="file" id="file" accept=".json" hidden>
      <button id="theme">Light</button>
    </div>
  </header>

  <div class="card settings" id="settings"></div>
  <div class="card" id="demand"></div>
  <div class="card" id="extras"></div>
  <div class="kpis" id="kpis"></div>
  <div class="card">
    <div class="phead"><h2>Stock vs expected sales, every colourway</h2>
      <div class="legend"><span><i style="background:var(--pop)"></i>units you're buying</span><span><i class="dash"></i>expected to sell at the 2 pop-ups</span></div></div>
    <div id="overview"></div>
    <div class="note">Bars past the yellow marker are stock you'd still hold after the pop-ups; bars short of it may sell out.</div>
  </div>
  <div id="products"></div>
  <div class="note" id="foot"></div>
</div>
<div id="tip"></div>

<script>
"use strict";
// ---- Streamlit bridge: the plan comes from the app's database and every change is sent back to be saved ----
const ST = { send(type, extra) { window.parent.postMessage({ isStreamlitMessage: true, type, ...extra }, "*"); } };
let started = false;
window.addEventListener("message", ev => {
  const d = ev.data;
  if (!d || d.type !== "streamlit:render") return;
  if (!started) { started = true; main(d.args); } else if (window.__update) window.__update(d.args);
});
ST.send("streamlit:componentReady", { apiVersion: 1 });
// keep the app's frame as tall as the planner (re-sent whenever the page changes size; checked regularly as a fallback)
let lastHeight = 0;
function sendHeight() { const h = document.documentElement.scrollHeight + 4; if (h !== lastHeight) { lastHeight = h; ST.send("streamlit:setFrameHeight", { height: h }); } }
new ResizeObserver(sendHeight).observe(document.documentElement);
setInterval(sendHeight, 700);

function main(ARGS) {
const SEED = { ...ARGS.start, ...ARGS.history, days: ARGS.start.days || 121 };
const SESSION = ARGS.session;
let version = ARGS.version, saveTimer = null, saveCount = 0, lastSaved = { at: ARGS.updatedAt, by: ARGS.updatedBy };
const KEY = "padre65-stock-planner-v1";
const gbp = (v, d = 0) => v == null || !isFinite(v) ? "–" : (v < 0 ? "-" : "") + "£" + Math.abs(v).toLocaleString("en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = v => v === "" || v == null ? null : Number(v);
const tiers = t => String(t || "").split(";").map(p => p.split(":").map(Number)).filter(p => p.length === 2 && isFinite(p[0]) && isFinite(p[1])).sort((a, b) => a[0] - b[0]);

let state = pickState();
function pickState() {
  const stored = load();
  if (SEED.shareId && (!stored || stored.shareId !== SEED.shareId)) {
    if (stored) { try { localStorage.setItem(KEY + "-backup", JSON.stringify(stored)); } catch (e) {} }
    const s = fresh(); s.shareId = SEED.shareId; return s;
  }
  return stored || fresh();
}
state.demand = { ...SEED.demand, ...(state.demand || {}) };
if (state.popupCost == null) state.popupCost = SEED.popupCost ?? 1500;
state.selected = state.selected || {};
let editingLog = null;  // "product|entry id" being edited
function fresh() { const s = JSON.parse(JSON.stringify(SEED)); s.selected = {}; return withLogs(s); }
function load() { return ARGS.plan && ARGS.plan.lines ? withImages(JSON.parse(JSON.stringify(ARGS.plan))) : null; }
// product photos always come from the file itself (a plan saved before they were added still gets them)
function withImages(s) {
  const img = ARGS.images || {};
  s.lines.forEach(l => {
    if (img[l.id]) l.img = img[l.id];
    const sl = SEED.lines.find(x => x.id === l.id); if (sl) l.group = sl.group;
    if (sl && l.emb === undefined) { l.emb = sl.emb; l.lab = sl.lab; l.ship = sl.ship; delete l.extra; }
    // plans saved before the whole-range model: keep an expected figure only if you had changed it
    if (l.expectedManual === undefined) l.expectedManual = l.seedExpected != null && l.expected !== l.seedExpected ? l.expected : null;
  });
  return withLogs(s);
}
// Notes are one dated log per product. Plans saved with a note on each colour are converted once.
function withLogs(s) {
  if (s.logs) return s;
  s.logs = {};
  const byProduct = {};
  for (const l of s.lines) (byProduct[l.product] = byProduct[l.product] || []).push(l);
  for (const [product, lines] of Object.entries(byProduct)) {
    const withNote = lines.filter(l => l.note && l.note.trim());
    if (!withNote.length) { s.logs[product] = JSON.parse(JSON.stringify((SEED.logs || {})[product] || [])); continue; }
    const same = withNote.every(l => l.note.trim() === withNote[0].note.trim());
    s.logs[product] = (same ? [withNote[0]] : withNote).map((l, i) => ({
      id: Date.now() + i, at: l.noteUpdated || new Date().toISOString(), edited: null,
      text: same || !l.colour ? l.note.trim() : `${l.colour}: ${l.note.trim()}` }));
  }
  for (const l of s.lines) { delete l.note; delete l.noteUpdated; }
  return s;
}
function savedText() {
  if (!lastSaved.at) return "Not saved yet";
  return `Saved for both of you · last change ${lastSaved.by ? `by ${lastSaved.by}, ` : ""}${fmtWhen(lastSaved.at)}`;
}
// changes are sent to the app (which saves them to the database) once you pause for a moment
function persist() {
  document.getElementById("saved").textContent = "Saving…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const plan = JSON.parse(JSON.stringify(state));
    plan.lines.forEach(l => delete l.img);
    for (const k of ["history", "sizeHistory", "coverage", "popupUnits", "popupOrders", "popupNet", "selected"]) delete plan[k];
    ST.send("streamlit:setComponentValue", { value: { plan, base: version, nonce: `${SESSION}-${++saveCount}` }, dataType: "json" });
  }, 700);
}
// the app re-renders after each save, or with your partner's changes when the page reloads
window.__update = a => {
  if (a.version > version) {
    const mine = a.updatedSession === SESSION;
    version = a.version; lastSaved = { at: a.updatedAt, by: a.updatedBy };
    if (!mine && a.plan) { state = withImages(JSON.parse(JSON.stringify(a.plan))); state.demand = { ...SEED.demand, ...(state.demand || {}) }; render(); }
  }
  document.getElementById("saved").textContent = savedText();
};

// supplier price at a quantity (price breaks), plus extras = cost per unit; your own cost overrides it
function quotedPrice(l, q) { let p = l.base; for (const [mq, mp] of tiers(l.tiers)) if (q >= mq) p = mp; return p; }
// your own supplier price (e.g. after negotiating) replaces the quote and its price breaks
function supplierPrice(l, q) { return l.supplierOverride != null ? l.supplierOverride : quotedPrice(l, q); }
function extras(l) { return (l.emb || 0) + (l.lab || 0) + (l.ship || 0); }
function costAt(l, q) { return l.cost != null ? l.cost : supplierPrice(l, q) + extras(l); }
function net(l) { return l.price * (1 - state.discount); }
function outcome(l, q, exp = l.expected) {
  const c = costAt(l, q), n = net(l), sold = Math.min(q, exp);
  const left = Math.max(0, q - exp);
  return { cost: c, spend: q * c, popupRevenue: sold * n, popupProfit: sold * n - q * c, soldProfit: sold * (n - c),
           allRevenue: q * n, allProfit: q * (n - c), left, leftRevenue: left * n, leftCost: left * c };
}

// ---------- demand: one total per product type, shared by everything of that type on sale ----------
// type total = (sales per pop-up x pop-ups x size vs last + online sales over the season) x choice effect x your emphasis
// choice effect = (designs on sale / designs that sold before) ^ strength: more choice adds a little, not a full extra item's worth
// the total is shared by your new colourways (by weight) and older stock (each older design, capped at the units you hold)
let DEMAND = {};
function computeDemand() {
  const d = state.demand, types = {};
  for (const l of state.lines) (types[l.group] = types[l.group] || []).push(l);  // substitutes share one demand pool
  DEMAND = {};
  for (const [type, lines] of Object.entries(types)) {
    const h = SEED.history[type] || {}, src = SEED.history[h.borrow] || h;
    const onSale = lines.filter(l => l.units > 0);
    const old = d.oldCompete ? (h.old || []) : [];
    const designs = onSale.length + old.reduce((a, o) => a + Math.min(1, o.units / 3), 0);  // an older design with 1-2 units left only counts partly
    const choice = src.histProducts ? Math.pow(Math.max(designs, 1) / src.histProducts, d.choice) : 1;
    // per pop-up = what sold last time + an allowance for sizes that sold out (the history figure is at 25%)
    const perPopup = src.lastPopup + (src.perPopup - src.lastPopup) * d.soldout / 0.25;
    const popups = perPopup * d.popups * d.scale, online = src.online30 / 30 * SEED.days * d.online;
    const total = (popups + online) * choice * (d.emphasis[type] ?? 1);
    // share out: fixed (typed) rows first, then new lines by weight and older designs equally, older ones capped at their stock
    const fixed = onSale.filter(l => l.expectedManual != null);
    let pool = Math.max(0, total - fixed.reduce((a, l) => a + l.expectedManual, 0));
    const takers = [...onSale.filter(l => l.expectedManual == null).map(l => ({ l, w: l.weight ?? 1, cap: Infinity })),
                    ...old.map(o => ({ o, w: 1, cap: o.units }))];
    const got = new Map();
    let active = takers.slice();
    for (let guard = 0; guard < 20 && active.length && pool > 1e-9; guard++) {
      const W = active.reduce((a, t) => a + t.w, 0), next = [];
      let spent = 0;
      for (const t of active) {
        const give = pool * t.w / W, have = got.get(t) || 0, room = t.cap - have;
        if (give >= room) { got.set(t, t.cap); spent += room; } else { got.set(t, have + give); spent += give; next.push(t); }
      }
      pool -= spent;
      if (next.length === active.length) break;
      active = next;
    }
    const oldTake = takers.filter(t => t.o).reduce((a, t) => a + (got.get(t) || 0), 0);
    for (const l of lines) l.expected = l.units > 0 ? (l.expectedManual != null ? l.expectedManual : Math.round((got.get(takers.find(t => t.l === l)) || 0) * 10) / 10) : 0;
    const newTake = onSale.reduce((a, l) => a + l.expected, 0);
    DEMAND[type] = { type, src: h.label || "your sales history", lastPopup: src.lastPopup,
                     perPopup, popups, online, designs, histProducts: src.histProducts, newDesigns: onSale.length, oldDesigns: old.length,
                     oldUnits: old.reduce((a, o) => a + o.units, 0), oldList: old.map(o => `${o.name} (${o.units})`).join(", "),
                     choice, total, oldTake, newTake };
  }
}

// ---------- render ----------
function render() {
  computeDemand();
  document.getElementById("coverage").textContent = SEED.coverage;
  document.getElementById("saved").textContent = savedText();
  renderSettings(); renderDemand(); renderExtras(); renderKpis(); renderOverview(); renderProducts();

  return attrs.length ? attrs.map(k => `[data-${k}="${CSS.escape(el.dataset[k])}"]`).join("") : null;
}
// Typing in a number box applies it after a short pause, so totals and charts follow what you see
let typingTimer = null;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.tagName !== "INPUT" || el.type === "checkbox" || el.type === "file" || !boxKey(el)) return;
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => { if (el.isConnected) el.dispatchEvent(new Event("change", { bubbles: true })); }, 450);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "file") return importFile(el.files[0]);
  if (el.classList && el.classList.contains("logbox")) return;  // typing a note must not re-render
  clearTimeout(typingTimer);
  const key = boxKey(el), keepFocus = document.activeElement === el, caret = el.selectionStart;
  if (el.dataset.extra) {
    const [prod, f] = el.dataset.extra.split("|");
    const v = f === "supplierOverride" ? (el.value.trim() === "" ? null : Math.max(0, num(el.value) ?? 0)) : Math.max(0, num(el.value) ?? 0);
    state.lines.filter(x => x.product === prod).forEach(x => { x[f] = v; });
  }
  if (el.dataset.set === "budget") state.budget = num(el.value);
  if (el.dataset.set === "popupCost") state.popupCost = Math.max(0, num(el.value) ?? 0);
  if (el.dataset.dset) state.demand[el.dataset.dset] = el.type === "checkbox" ? el.checked : el.dataset.dset === "soldout" ? Math.max(0, (num(el.value) ?? 0) / 100) : Math.max(0, num(el.value) ?? 0);
  if (el.dataset.emph) state.demand.emphasis = { ...state.demand.emphasis, [el.dataset.emph]: Math.max(0, num(el.value) ?? 1) };
  if (el.dataset.set === "discount") state.discount = Math.min(0.9, Math.max(0, (num(el.value) || 0) / 100));
  if (el.dataset.line) {
    const l = state.lines.find(x => x.id == el.dataset.line), f = el.dataset.f, v = num(el.value);
    if (f === "size") setSizeQty(l, el.dataset.size, v);
    else if (f === "sizes") setSizes(l, el.value);
    else if (f === "sizeBasis") l.sizeBasis = el.value === defaultBasis(l) ? null : el.value;
    else if (f === "cost") l.cost = v;
    else if (f === "expected") l.expectedManual = v != null && v >= 0 ? v : null;
    else if (v != null && v >= 0) l[f] = f === "units" ? Math.round(v) : v;
    if (f === "units") fitSizes(l);
  }
  persist(); render();

  if (keepFocus && key) {
    const again = document.querySelector(key);

  }
});
function applyTyping() {
  const a = document.activeElement;
  if (a && a.tagName === "INPUT" && boxKey(a) && typingTimer) { clearTimeout(typingTimer); typingTimer = null; a.dispatchEvent(new Event("change", { bubbles: true })); }
}
// pressing a button doesn't take focus from the box you're typing in, so the page isn't redrawn mid-click
document.addEventListener("mousedown", e => { if (e.target.closest("[data-sizes],[data-sizeclose],[data-sizeclear],[data-step]")) e.preventDefault(); });
document.addEventListener("click", e => {
  const n = e.target.closest("[data-logadd],[data-logedit],[data-logsave],[data-logcancel],[data-logdel]");
  if (n) {
    const names = groups().map(([product]) => product);
    const [gi, id] = (n.dataset.logadd || n.dataset.logedit || n.dataset.logsave || n.dataset.logdel || "").split("|");
    const product = names[Number(gi)], log = state.logs[product] = state.logs[product] || [];
    if (n.dataset.logadd) {
      const box = document.getElementById(`logadd-${gi}`), text = box.value.trim();
      if (!text) { box.focus(); return; }
      log.push({ id: Date.now(), at: new Date().toISOString(), edited: null, text, by: ARGS.user || "" });
    }
    if (n.dataset.logedit) editingLog = `${product}|${id}`;
    if (n.dataset.logcancel) editingLog = null;
    if (n.dataset.logsave) {
      const e2 = log.find(x => x.id == id), text = document.getElementById("logedit").value.trim();
      if (e2 && text) { e2.text = text; e2.edited = new Date().toISOString(); }
      editingLog = null;
    }
    if (n.dataset.logdel) {
      if (!confirm("Delete this note?")) return;
      state.logs[product] = log.filter(x => x.id != id);
    }
    persist(); render();
    const box = document.getElementById("logedit"); if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
    return;
  }
  const z = e.target.closest("[data-sizes],[data-sizeclear],[data-sizeclose],[data-szadd],[data-szedit],[data-szsave],[data-szdel]");
  if (z) {
    applyTyping();
    const d = z.dataset;
    if (d.sizes) { const open = !openSizes[d.sizes]; openSizes = {}; if (open) openSizes[d.sizes] = true; }  // one panel at a time
    if (d.sizeclose) { openSizes = {}; persist(); }  // every change is already saved; this makes sure the last one is sent
    if (d.sizeclear) { state.lines.find(x => x.id == d.sizeclear).sizeQty = null; persist(); }
    const [lid, eid] = (d.szadd || d.szedit || d.szsave || d.szdel || "").split("|");
    const key = `sizes:${lid}`, log = lid ? (state.logs[key] = state.logs[key] || []) : null;
    if (d.szadd) {
      const box = document.getElementById(`szadd-${lid}`), text = box.value.trim();
      if (!text) { box.focus(); return; }
      log.push({ id: Date.now(), at: new Date().toISOString(), edited: null, text, by: (typeof ARGS !== "undefined" && ARGS.user) || "" });
      persist();
    }
    if (d.szedit) editingLog = `${key}|${eid}`;
    if (d.szsave) {
      const e2 = log.find(x => x.id == eid), text = document.getElementById("logedit").value.trim();
      if (e2 && text) { e2.text = text; e2.edited = new Date().toISOString(); }
      editingLog = null; persist();
    }
    if (d.szdel) { if (!confirm("Delete this note?")) return; state.logs[key] = log.filter(x => x.id != eid); persist(); }
    render();
    const box = document.getElementById("logedit"); if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
    if (d.sizes && openSizes[d.sizes]) document.getElementById(`sizepanel-${d.sizes}`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    return;
  }
  const t = e.target.closest("[data-step],[data-pick],[data-edit-cost]");
  if (!t) return;
  applyTyping();
  if (t.dataset.step) { const [id, d] = t.dataset.step.split("|"); const l = state.lines.find(x => x.id == id); l.units = Math.max(0, l.units + Number(d)); fitSizes(l); }
  if (t.dataset.pick) { const [p, id] = t.dataset.pick.split("|"); state.selected[p] = Number(id); }
  if (t.dataset.editCost) { const l = state.lines.find(x => x.id == t.dataset.editCost); l.cost = Math.round(costAt(l, l.units) * 100) / 100; }
  persist(); render();
});
const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => { const t = e.target.closest("[data-tip]"); if (!t) { tip.style.display = "none"; return; }
  tip.innerHTML = t.dataset.tip; tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY + 14) + "px"; });
document.getElementById("save").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 1)], { type: "application/json" }));
  a.download = `padre65-stock-plan-${new Date().toISOString().slice(0, 10)}.json`; a.click(); };
document.getElementById("load").onclick = () => document.getElementById("file").click();
function importFile(f) { if (!f) return; const r = new FileReader(); r.onload = () => { try {
    if (!confirm("Replace the shared plan (for both of you) with the plan in this file? Notes already in the shared plan are kept.")) return;
    const m = r.result.match(/<script id="seed" type="application\/json">([\s\S]*?)<\/script>/);
    const s = JSON.parse(m ? m[1].replace(/<\\\//g, "</") : r.result);
    if (s.logs && state.logs) for (const [p, es] of Object.entries(state.logs)) { s.logs[p] = s.logs[p] || []; const ids = new Set(s.logs[p].map(e => e.id)); es.forEach(e => { if (!ids.has(e.id)) s.logs[p].push(e); }); } if (!s.lines) throw 0; state = withImages(s); persist(); render(); } catch (e) { alert("That isn't a saved stock plan."); } }; r.readAsText(f); }
document.getElementById("theme").onclick = () => { const t = document.documentElement.dataset.theme === "light" ? "dark" : "light"; document.documentElement.dataset.theme = t; try { localStorage.setItem(KEY + "-theme", t); } catch (e) {} render(); };
try { const t = localStorage.getItem(KEY + "-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
render();
}  // main
